<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 400px;
            height: 400px;
            background-color: red;
        }
        h2{
            width: 200px;
            height: 200px;
            background-color: yellow;
        }
        em{
            width: 100px;
            height: 100px;
            background-color: #00ff00;
        }
    </style>
    //冒泡：事件会从最里层开始，逐级向上传播，直到document元素。
    //冒泡是从子元素到父元素的传播方式。
    //捕获：事件会从最外层开始，逐级向下传播，直到目标元素。
</head>
<body>
<h1>24002120207 王振旭</h1>
    <button id="myButton" onclick="clickfun()">点击事件</button>
    <div class="box">
        <h2 id="h2">是冒泡还是<em id="em">捕获</em></h2>
        <imput type="text" id="input" placeholder="请输入内容">
            <script>
                function clickfun(){
                    alert("点击事件");
                }
                var box= document.getElementById("box");
                //只有id为box的元素才会触发事件
                box.addEventListener("click",function(){
                    alert("box");
                },false);//false表示冒泡，true表示捕获
                var h2= document.getElementById("h2");
                h2.addEventListener("click",function(){
                    alert("h2");
                },false);
                var em= document.getElementById("em");
                em.addEventListener("click",function(){ 
                    alert("em");
                    stopPropagation();//阻止事件冒泡
                },false);
            </script>
    </div>
</body>
</html>
