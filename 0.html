    <script>
        var a = 10;
        var b = 20;
        console.log(a++,++b);
        console.log(a+b);
        console.log(a-b>0?a:b);
        console.log(true&&false,true||false,!true);
        var str='hello,world', num = 123,bl = true,obj = {name:'张三',age:20},ud,kong=null;

        console.log(parseInt(100,16));
        var c = 0;
        for(var i=0;i<=100;i++){
            c+=i;
        }
        for(var t=0;t<100;t++){
            if(t%7==0 || t%10==7 || Math.floor(t/10)==7){
                document.write("<div></div>");
            }
            else{
                document.write("<div>"+t+"</div>");    
            };

        }
        //回文数，11 22

            if(i%10==Math.floor(i/10)){

            }
        }
