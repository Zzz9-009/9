<h1>24002120207 王振旭</h1>

    <p class="subcopy">完成小小挑战，给星球补充能量。</p>
    <section class="section card">
        <div class="row"><strong>今日活跃度</strong><strong>2 / 4</strong></div>
        <div class="progress" style="margin:12px 0"><span style="width:50%"></span></div>
        <p class="subcopy">再完成 2 个任务可领取特别奖励</p>
    </section>
    <section class="section">
        <div class="card">
            <div class="row"><span class="round-icon">🪐</span><span style="flex:1"><h3>探索一颗星球</h3><p class="subcopy">进入星球地图完成任意关卡</p></span><span class="pill">+10 能量</span></div>
            <div class="row" style="margin-top:14px"><span class="muted" style="font-size:12px">进度 0 / 1</span><a class="button small" href="planet-worlds.html">去完成</a></div>
        </div>
        <div class="card">
            <div class="row"><span class="round-icon">🐑</span><span style="flex:1"><h3>和小羊打个招呼</h3><p class="subcopy">访问个人中心看看伙伴</p></span><span class="pill">+5 能量</span></div>
            <div class="row" style="margin-top:14px"><span class="muted" style="font-size:12px">进度 0 / 1</span><a class="button small" href="planet-me.html">去看看</a></div>
        </div>
        <div class="card">
            <div class="row"><span class="round-icon">⭐</span><span style="flex:1"><h3>收集 3 颗星星</h3><p class="subcopy">闯关时努力消除更多方块</p></span><span class="pill">+15 能量</span></div>
            <div class="row" style="margin-top:14px"><span class="muted" style="font-size:12px">进度 1 / 3</span><a class="button small" href="planet-game.html">去闯关</a></div>
        </div>
    </section>
    <section class="section card"><div class="row"><span>🎁 连续签到奖励</span><span class="pill">已签到 2 天</span></div><button class="button small" style="margin-top:13px" type="button" data-toast="签到成功，获得 5 点能量！">领取今日奖励</button></section>
    <p class="page-end">每日 0 点刷新任务</p>
